name: telegram_liquid
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cupertino_icons: ^1.0.9
  ffi: ^2.2.0
  file_picker: ^13.0.0
  flutter:
    sdk: flutter
  flutter_cupertino_symbols: ^1.0.3
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.3
  intl: ^0.20.3
  liquid_glass_widgets: ^1.4.4
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# Generates the Android launcher icons from assets/app_icon.png.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#0A5CD6"
  adaptive_icon_foreground: assets/app_icon.png
