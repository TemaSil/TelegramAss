# Builds libtdjson.so for Android and publishes it as a release asset, which
# the APK workflow then unpacks into jniLibs.
#
# TDLib ships no prebuilt Android binaries, and compiling OpenSSL plus TDLib
# for every ABI takes hours — so this runs on demand rather than on every push,
# and its output is reused until TDLib is bumped.
name: Build TDLib

on:
  workflow_dispatch:
    inputs:
      tdlib_ref:
        description: 'tdlib/td git ref to build'
        required: false
        default: 'master'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make git zlib1g-dev libssl-dev gperf php-cli \
            cmake clang libc++-dev libc++abi-dev perl

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check out TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_ref || 'master' }}
          path: td

      - name: Record the exact commit
        id: rev
        run: echo "sha=$(git -C td rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check environment
        working-directory: td/example/android
        run: ./check-environment.sh

      - name: Fetch Android SDK
        working-directory: td/example/android
        run: ./fetch-sdk.sh

      - name: Build OpenSSL
        working-directory: td/example/android
        run: ./build-openssl.sh

      # Empty arguments keep each script's default; the last selects the JSON
      # interface, which is what lib/data/tdlib/tdlib_ffi.dart binds to.
      - name: Build TDLib (JSON interface)
        working-directory: td/example/android
        run: ./build-tdlib.sh '' '' '' '' 'JSON'

      - name: Collect the shared libraries
        run: |
          mkdir -p out/jniLibs
          find td/example/android/tdlib/libs -name 'libtdjson.so' -print
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            src="td/example/android/tdlib/libs/$abi/libtdjson.so"
            if [ -f "$src" ]; then
              mkdir -p "out/jniLibs/$abi"
              cp "$src" "out/jniLibs/$abi/libtdjson.so"
            fi
          done
          ls -R out/jniLibs
          (cd out && zip -r ../tdlib-jnilibs.zip jniLibs)

      - uses: actions/upload-artifact@v4
        with:
          name: tdlib-jnilibs
          path: tdlib-jnilibs.zip
          if-no-files-found: error

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tdlib-${{ steps.rev.outputs.sha }}
          name: TDLib ${{ steps.rev.outputs.sha }} (Android, JSON interface)
          body: |
            `libtdjson.so` built from tdlib/td@${{ steps.rev.outputs.sha }} for
            the Android ABIs. The APK workflow unpacks this into
            `android/app/src/main/jniLibs/`.
          files: tdlib-jnilibs.zip
          fail_on_unmatched_files: true
