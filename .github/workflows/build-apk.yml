name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Pull the most recent TDLib build, if one has been published. Without it
      # the APK still runs, on the demo backend.
      - name: Fetch libtdjson.so
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 50 \
                  --json tagName --jq '[.[] | select(.tagName | startswith("tdlib-"))][0].tagName' \
                || true)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No TDLib release yet — the APK will ship demo mode only."
            exit 0
          fi
          echo "Using TDLib release $tag"
          gh release download "$tag" --pattern 'tdlib-jnilibs.zip' --clobber
          unzip -o tdlib-jnilibs.zip -d tdlib-native
          mkdir -p android/app/src/main/jniLibs
          cp -r tdlib-native/jniLibs/* android/app/src/main/jniLibs/
          find android/app/src/main/jniLibs -name '*.so' -exec ls -lh {} +

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Credentials are optional: with no secrets set the APK ships the demo
      # backend, which is what keeps pull requests buildable by anyone.
      - name: Build APKs
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          DEFINES=""
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            echo "Building against the live Telegram API."
            DEFINES="--dart-define=TELEGRAM_API_ID=$TELEGRAM_API_ID --dart-define=TELEGRAM_API_HASH=$TELEGRAM_API_HASH"
          else
            echo "No API credentials configured — building in demo mode."
          fi
          # The run number becomes the Android versionCode, so each build is
          # seen as an update rather than the same version reinstalled.
          VERSION="--build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}"
          flutter build apk --debug $VERSION $DEFINES
          flutter build apk --release $VERSION $DEFINES

      - name: Name the artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk \
             dist/telegram-liquid-${{ github.run_number }}-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/telegram-liquid-${{ github.run_number }}-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-liquid-apk
          path: dist/*.apk
          if-no-files-found: error

      # A release gives a plain download link that works without a GitHub
      # login, which an Actions artifact does not.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated build of `${{ github.sha }}`.

            `telegram-liquid-${{ github.run_number }}-release.apk` is the one to
            install on a phone. Demo mode unless the repository has
            `TELEGRAM_API_ID` / `TELEGRAM_API_HASH` secrets set.
          files: dist/*.apk
          fail_on_unmatched_files: true
